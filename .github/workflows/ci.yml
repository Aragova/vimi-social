name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vimi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vimi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: postgres_ci
      VIMI_MIGRATION_DSN: postgresql+psycopg://vimi_migrator:vimi_migrator_local@localhost:5432/vimi
      VIMI_DATABASE_DSN: postgresql+psycopg://vimi_app:vimi_app_local@localhost:5432/vimi
      VIMI_TEST_ADMIN_DSN: postgresql://postgres:postgres_ci@localhost:5432/vimi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Bootstrap restricted database roles
        run: psql -h localhost -U postgres -d vimi -f scripts/bootstrap_local_roles.sql
      - name: Apply migrations as migration role
        run: alembic upgrade head
      - name: Verify runtime role restrictions
        run: |
          test "$(psql -h localhost -U postgres -d vimi -Atqc "SELECT NOT rolsuper AND NOT rolbypassrls AND NOT rolcreaterole AND NOT rolcreatedb FROM pg_roles WHERE rolname = 'vimi_app'")" = "t"
      - name: Ruff
        run: ruff check src apps tests
      - name: Pyright
        run: pyright src apps tests
      - name: Pytest
        run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
