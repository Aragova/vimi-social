name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src apps tests
      - name: Pyright
        run: pyright src apps tests
      - name: Pytest
        run: pytest

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vimi
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vimi"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      VIMI_TEST_DATABASE_DSN: postgresql+psycopg://vimi_app@localhost:5432/vimi
      VIMI_TEST_ADMIN_DSN: postgresql://postgres@localhost:5432/vimi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Bootstrap database roles
        run: psql -h localhost -U postgres -d vimi -v ON_ERROR_STOP=1 -f infra/postgres/bootstrap_roles.sql
      - name: Apply migrations
        run: alembic upgrade head
      - name: PostgreSQL RLS integration tests
        run: pytest tests/integration/test_postgres_rls.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
