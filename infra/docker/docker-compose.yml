services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: vimi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local
    ports:
      - "5432:5432"
    volumes:
      - ../../scripts/bootstrap_local_roles.sql:/docker-entrypoint-initdb.d/001_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vimi"]
      interval: 2s
      timeout: 2s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.27.2
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres_local
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "7233:7233"
