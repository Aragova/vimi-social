services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: vimi
      POSTGRES_USER: vimi_migrator
      POSTGRES_PASSWORD: vimi_migrator
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vimi_migrator -d vimi"]
      interval: 2s
      timeout: 2s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.27.2
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: vimi_migrator
      POSTGRES_PWD: vimi_migrator
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["7233:7233"]
